name: b11-workflow

on: push

jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: create a file
        run:  echo "This is test report" > report.txt

      - name: upload a file
        uses: actions/upload-artifact@v4
        with:
          name: report.txt
          path: ./report.txt


  second-job:
    runs-on: ubuntu-latest
    needs: first-job
    steps:


      - name: download the artifact
        uses: actions/download-artifact@v4
        with:
          name: report.txt

      - name:  viewing the report from first job
        run: cat report.txt
             
             
   