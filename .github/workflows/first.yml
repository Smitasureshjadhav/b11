name: b11-workflow

on: push

jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name:  print message for 5th job
        run: sleep 10
             echo "This is 5th job"

  second-job:
    runs-on: ubuntu-latest
    needs: first-job
    steps:
      - name:  print message for 4th job
        run: sleep 5
             echo "This is 4th job"
             
   